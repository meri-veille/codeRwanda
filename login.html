<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CODERWANDA Ltd | Log in</title><style>
:root{--purple:#6258d9;--purple-dark:#4b43b8;--ink:#24243b;--muted:#77788e;--line:#e8e8f1;--soft:#f5f4ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#fafaff}a{text-decoration:none}
header{padding:18px 7%;display:flex;align-items:center;justify-content:space-between;gap:18px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:800;font-size:1.15rem}.mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#8c83ff,#5147c8)}
nav{display:flex;align-items:center;gap:25px}nav a{color:#66677e;font-size:.93rem;font-weight:650}nav a:hover,nav a.active{color:var(--purple)}nav .nav-cta{background:var(--purple);color:white;padding:11px 17px;border-radius:10px}
.hero{padding:80px 7%;background:linear-gradient(120deg,#f0efff,#faf9ff 55%,#eaf6ff);overflow:hidden}.hero-inner{max-width:1180px;margin:auto;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:50px}
.eyebrow{display:inline-block;padding:8px 13px;border:1px solid #dedcff;border-radius:30px;color:var(--purple-dark);background:#ffffffb8;font-size:.82rem;font-weight:750}
h1{font-size:clamp(2.6rem,5.5vw,4.4rem);line-height:1.07;letter-spacing:-2px;margin:20px 0 16px}h1 span{color:var(--purple)}.hero-copy{max-width:560px;color:#70718a;font-size:1.08rem;line-height:1.8}
.actions{display:flex;flex-wrap:wrap;gap:13px;margin-top:27px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 20px;border-radius:10px;font-weight:750}.primary{background:var(--purple);color:#fff;box-shadow:0 8px 20px #6258d933}.primary:hover{background:var(--purple-dark);transform:translateY(-2px)}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
.preview{max-width:370px;margin:auto;padding:25px;border:1px solid white;border-radius:22px;background:#ffffffed;box-shadow:0 24px 65px #37347720;transform:rotate(2deg)}
.preview-head{display:flex;justify-content:space-between;margin-bottom:24px}.dots{color:#aaa;letter-spacing:3px}.tag{padding:7px 10px;border-radius:20px;background:#f0efff;color:var(--purple);font-size:.72rem;font-weight:800}
.person{display:flex;align-items:center;gap:12px;margin:18px 0}.avatar{width:43px;height:43px;display:grid;place-items:center;border-radius:14px;background:#efeeff;color:#5d56c9;font-weight:800}.avatar.blue{background:#e8f5ff;color:#2876a9}.avatar.pink{background:#fff0f6;color:#b35b89}.person strong{display:block;font-size:.9rem}.person small{color:var(--muted)}.online{margin-left:auto;width:9px;height:9px;border-radius:50%;background:#42c99a}
.section{max-width:1180px;margin:auto;padding:68px 7%}.section-title{text-align:center;max-width:620px;margin:0 auto 34px}.section-title h2{font-size:2rem;margin:0 0 10px}.section-title p,.feature p{color:var(--muted);line-height:1.7}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.feature{padding:25px;background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 8px 25px #25254a08}.feature-icon{font-size:1.35rem;background:#f0efff;border-radius:13px;width:47px;height:47px;display:grid;place-items:center}.feature h3{margin:17px 0 8px}.feature p{font-size:.92rem;margin:0}
.cta{margin:0 7% 65px;padding:36px 20px;text-align:center;border-radius:20px;color:white;background:linear-gradient(120deg,#6258d9,#8981f6)}.cta h2{margin:0 0 9px}.cta p{color:#eeedff;margin:0 0 20px}.cta a{background:#fff;color:var(--purple-dark)}
footer{padding:22px 7%;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);background:#fff;border-top:1px solid var(--line);font-size:.85rem}
.auth-main{min-height:calc(100vh - 140px);padding:45px 18px;display:grid;place-items:center;background:radial-gradient(circle at 12% 15%,#e7e5ff,transparent 25%),radial-gradient(circle at 88% 85%,#e4f4ff,transparent 26%),#fafaff}
.card{width:min(100%,465px);padding:36px;border:1px solid #ececf5;border-radius:22px;background:#fff;box-shadow:0 20px 60px #34336c12}.card h1{font-size:1.85rem;letter-spacing:-.8px;margin:0 0 9px}.intro{color:var(--muted);line-height:1.6;margin:0 0 26px}.card-icon{width:52px;height:52px;display:grid;place-items:center;margin-bottom:20px;border-radius:16px;color:var(--purple);background:#f0efff;font-size:1.4rem}
.field{margin-bottom:18px}.field label{display:block;margin-bottom:8px;font-size:.88rem;font-weight:750}.field input{width:100%;min-height:48px;padding:12px 14px;border:1px solid #dedfeb;border-radius:10px;font-size:.95rem;outline:none}.field input:focus{border-color:var(--purple);box-shadow:0 0 0 3px #6258d91c}.submit{width:100%;min-height:49px;border:0;border-radius:10px;background:var(--purple);color:white;font-size:.96rem;font-weight:750;cursor:pointer}.submit:hover{background:var(--purple-dark)}.switch{text-align:center;color:var(--muted);margin:23px 0 0;font-size:.9rem}.switch a,.forgot{color:var(--purple);font-weight:750}.form-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 20px;font-size:.84rem;color:var(--muted)}.form-row label{display:flex;align-items:center;gap:7px}.note{text-align:center;color:#999bad;font-size:.76rem;line-height:1.5;margin:17px 0 0}
@media(max-width:820px){.hero-inner{grid-template-columns:1fr;gap:35px}.features{grid-template-columns:1fr}.hero{padding-top:60px}}
@media(max-width:560px){header{padding:15px 5%;flex-wrap:wrap}nav{width:100%;justify-content:space-between;gap:9px}nav a{font-size:.83rem}.hero{padding:50px 6%}.section{padding:52px 6%}.cta{margin:0 6% 45px;padding:28px 18px}.card{padding:28px 22px}footer{padding:20px 6%}}
</style></head>
<body><header><a class="brand" href="index.html"><span class="mark">C</span> CODERWANDA Ltd</a><nav><a href="index.html">Home</a><a href="register.html">Register</a><a class="active" href="login.html">Log in</a></nav></header>
<main class="auth-main"><section class="card"><div class="card-icon">♡</div><h1>Welcome back</h1><p class="intro">It is great to see you again. Enter your details to continue.</p>
<form action="#" method="post">
<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required></div>
<div class="form-row"><label><input type="checkbox" name="remember"> Remember me</label><a class="forgot" href="register.html">Need an account?</a></div>
<button class="submit" type="submit">Log in&nbsp; →</button></form>
<p class="switch">New to CODERWANDA? <a href="register.html">Create an account</a></p><p class="note">This is a frontend demonstration. Secure login will be connected to a backend later.</p></section></main>
<footer><span>© 2026 CODERWANDA Ltd.</span><a href="index.html" style="color:inherit">Back to home</a></footer></body></html>
